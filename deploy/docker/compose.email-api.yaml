name: emailflare

services:
    app:
        build:
            context: ../..
            dockerfile: deploy/docker/Dockerfile.email-api
            network: host
        ports:
            # Maps host ${PORT:-8090} -> container 8090 (where Caddy is listening)
            - "${PORT:-8090}:8090"
        env_file:
            - .env.local
        environment:
            - NODE_ENV=production
        volumes:
            - app-data:/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

volumes:
    app-data:
